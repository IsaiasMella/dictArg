[package]
name = "voice"
version = "0.2.2"
description = "Dictado por voz: atajo global, transcripcion via Deepgram e inyeccion de texto"
authors = ["Isaias"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[lib]
# El sufijo `_lib` evita el choque de nombres entre lib y bin en Windows.
name = "voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# Avisa cuando el webview se cae y hay que recargarlo. Va por el sistema
# operativo y no por la pastilla porque si se murio WebView2 la pastilla tampoco esta.
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Los pedidos a Deepgram y a Groq salen desde Rust, no desde el webview: ver
# `stt.rs`. `dotenvy` carga el `.env` en desarrollo; en la app instalada no hay
# ninguno y las credenciales salen del llavero.
reqwest = { version = "0.12", features = ["json"] }
dotenvy = "0.15"
base64 = "0.22"
arboard = "3"
enigo = "0.3"
keyring = "2"
# Abre los links de contacto de la Ayuda en el navegador del sistema. Se usa sólo
# desde Rust (`contact.rs`): el webview no tiene permiso para abrir URLs.
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Solo Windows: recordar y devolver el foco a la ventana donde el usuario estaba
# escribiendo. Ver src/focus.rs.
[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  # DPAPI, para cifrar el archivo de credenciales cuando no hay llavero.
  "Win32_Security_Cryptography",
] }
